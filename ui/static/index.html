<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bitso Trading Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
  <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#08100f;--glass:#10201dcc;--line:#25433d;--text:#e9f7f2;--muted:#87a49b;--green:#38d39f;--red:#ff627d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#17352e 0,transparent 35%),var(--bg);color:var(--text);font:16px Outfit,sans-serif}
    main{max-width:1440px;margin:auto;padding:24px}.top,.grid{display:grid;gap:16px}.top{grid-template-columns:1fr auto;align-items:center}.grid{grid-template-columns:2fr 1fr;margin-top:18px}.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px #0005;backdrop-filter:blur(18px);padding:18px}
    h1,h2,p{margin:0}h1{font-size:clamp(1.5rem,4vw,2.5rem)}h2{font-size:1rem;color:var(--muted);margin-bottom:12px}.tag{padding:7px 10px;border-radius:99px;background:#17342d;color:var(--green)}#chart{height:480px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{padding:14px;border:1px solid var(--line);border-radius:12px}.metric span{display:block;color:var(--muted);font-size:.8rem}.metric strong{font-size:1.15rem}
    .policy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.policy div{height:9px;border-radius:9px;background:var(--line)}.policy .active{background:var(--green)}button,input{font:inherit;border-radius:10px;border:1px solid var(--line);padding:10px;background:#0a1513;color:var(--text)}button{cursor:pointer}.danger{border-color:#713442;color:#ff9cad}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}#logs{height:196px;overflow:auto;color:var(--muted);font:13px ui-monospace,monospace;white-space:pre-wrap}.auth{position:fixed;inset:0;display:grid;place-items:center;background:#07100fed;z-index:5}.auth form{width:min(420px,90vw)}.auth p{color:var(--muted);margin:8px 0 16px}.hidden{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}#chart{height:340px}}
  </style>
</head>
<body>
  <div id="auth" class="auth"><form id="login" class="glass"><h1>Trading Console</h1><p>Enter the local dashboard bearer token.</p><label for="token">Access token</label><input id="token" type="password" minlength="16" autocomplete="current-password" required><button>Connect</button></form></div>
  <main>
    <header class="top"><div><p style="color:var(--green)">BITSO EXECUTION</p><h1>Market &amp; risk monitor</h1></div><span id="mode" class="tag">OFFLINE</span></header>
    <section class="grid">
      <div class="glass"><h2><select id="book" aria-label="Trading book"><option value="btc_usd">BTC/USD</option><option value="eth_usd">ETH/USD</option></select> · LIVE MIDPOINT CANDLES</h2><div id="chart" role="img" aria-label="Candlestick price chart with trade and bracket markers"></div></div>
      <aside class="glass"><h2>ENGINE</h2><div class="stats"><div class="metric"><span>Equity</span><strong id="equity">—</strong></div><div class="metric"><span>Drawdown</span><strong id="drawdown">—</strong></div><div class="metric"><span>Position</span><strong id="position">Flat</strong></div><div class="metric"><span>Confidence</span><strong id="confidence">—</strong></div></div><div class="policy" aria-label="Policy direction"><div id="short"></div><div id="flat"></div><div id="long"></div></div><p id="policy-label" style="color:var(--muted);margin-top:8px">Policy output unavailable</p><div class="toolbar"><button data-action="start">Start</button><button data-action="pause">Pause</button><button id="kill" class="danger">Kill</button></div></aside>
      <div class="glass"><h2>EQUITY &amp; DRAWDOWN</h2><div id="equity-chart" style="height:190px"></div></div>
      <div class="glass"><h2>EVENT LOG</h2><div id="logs" aria-live="polite"></div></div>
    </section>
  </main>
  <script>
    let token, socket, candleSeries, equitySeries, drawdownSeries, stopLine, takeProfitLine, markerApi, selectedBook='btc_usd', markers=[];
    const chartOptions={layout:{background:{color:'transparent'},textColor:'#87a49b'},grid:{vertLines:{color:'#17302b'},horzLines:{color:'#17302b'}},rightPriceScale:{borderColor:'#25433d'},timeScale:{borderColor:'#25433d'}};
    const chart=LightweightCharts.createChart(document.querySelector('#chart'),chartOptions); candleSeries=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#38d39f',downColor:'#ff627d',borderVisible:false,wickUpColor:'#38d39f',wickDownColor:'#ff627d'});markerApi=LightweightCharts.createSeriesMarkers(candleSeries,markers);
    const eqChart=LightweightCharts.createChart(document.querySelector('#equity-chart'),chartOptions); equitySeries=eqChart.addSeries(LightweightCharts.LineSeries,{color:'#38d39f',lineWidth:2}); drawdownSeries=eqChart.addSeries(LightweightCharts.AreaSeries,{lineColor:'#ff627d',topColor:'#ff627d22',bottomColor:'#ff627d00'});
    const log=(value)=>{const el=document.querySelector('#logs');el.textContent=`${new Date().toISOString()} ${value}\n${el.textContent}`.slice(0,12000)};
    function clearBracket(){if(stopLine)candleSeries.removePriceLine(stopLine);if(takeProfitLine)candleSeries.removePriceLine(takeProfitLine);stopLine=takeProfitLine=null}
    function render(event){const p=event.payload||{};if(event.type==='state'){document.querySelector('#mode').textContent=`${p.mode} · ${p.lifecycle}`;document.querySelector('#position').textContent=p.position?`${p.position.direction>0?'Long':'Short'} ${p.position.quantity}`:'Flat'}if(event.type==='candle'&&p.book===selectedBook)candleSeries.update(p);if(event.type==='equity'){equitySeries.update({time:p.time,value:Number(p.equity)});drawdownSeries.update({time:p.time,value:Number(p.drawdown)});document.querySelector('#equity').textContent=p.equity;document.querySelector('#drawdown').textContent=p.drawdown}if(event.type==='trade'&&p.book===selectedBook){markers.push(p);markers=markers.slice(-200);markerApi.setMarkers(markers)}if(event.type==='bracket'&&(p.clear||p.book===selectedBook)){clearBracket();if(!p.clear){stopLine=candleSeries.createPriceLine({price:Number(p.stop),color:'#ff627d',title:'SL'});takeProfitLine=candleSeries.createPriceLine({price:Number(p.take_profit),color:'#38d39f',title:'TP'})}}if(event.type==='policy'){['short','flat','long'].forEach(x=>document.querySelector(`#${x}`).classList.toggle('active',x===p.direction));document.querySelector('#confidence').textContent=`${Math.round((p.confidence||0)*100)}%`;document.querySelector('#policy-label').textContent=p.kind==='ppo_native'?'Native PPO probabilities':'Derived normalized scores (not calibrated probabilities)'}if(event.type==='log')log(p.message||'event');}
    async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json',...(options.headers||{})}});if(!response.ok)throw Error(`request failed (${response.status})`);return response.json()}
    function connect(){socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);socket.onopen=()=>socket.send(JSON.stringify({token}));socket.onmessage=e=>render(JSON.parse(e.data));socket.onclose=()=>log('stream disconnected');}
    document.querySelector('#login').onsubmit=async e=>{e.preventDefault();token=document.querySelector('#token').value;try{render({type:'state',payload:await api('/api/state')});document.querySelector('#auth').classList.add('hidden');connect()}catch{log('authentication failed')}};
    document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>api('/api/lifecycle',{method:'POST',body:JSON.stringify({action:button.dataset.action})}).then(p=>render({type:'state',payload:p})).catch(e=>log(e.message)));
    document.querySelector('#kill').onclick=()=>{if(confirm('Freeze decisions, cancel orders, and liquidate tracked exposure?'))api('/api/kill',{method:'POST'}).then(()=>log('kill completed')).catch(e=>log(e.message))};
    document.querySelector('#book').onchange=e=>{selectedBook=e.target.value;candleSeries.setData([]);markers=[];markerApi.setMarkers(markers);clearBracket()};
    addEventListener('resize',()=>{chart.applyOptions({width:document.querySelector('#chart').clientWidth});eqChart.applyOptions({width:document.querySelector('#equity-chart').clientWidth})});
  </script>
</body>
</html>
